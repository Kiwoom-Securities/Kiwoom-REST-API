[project]
name = "kiwoom-upload"
version = "0.1.0"
description = "Kiwoom OpenAPI toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "platformdirs>=4.9.4",
    "requests>=2.33.1",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiwoom"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: real-server end-to-end tests (require demo credentials)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
