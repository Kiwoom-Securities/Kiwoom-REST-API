[project]
name = "kwcli"
version = "1.0.1"
description = "Kiwoom OpenAPI toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "pandas>=3.0.3",
    "platformdirs>=4.9.4",
    "requests>=2.33.1",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiwoom"]
artifacts = [
    "kiwoom/_data/*.json",
]

[tool.hatch.build.targets.sdist]
# kiwoom 런타임 + examples 최소구성본: 업로드에 필요한 것만 포함.
include = [
    "/kiwoom",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE.md",
]
exclude = [
    "**/.DS_Store",
    "**/__pycache__",
]
