[project]
name = "kiwoom-upload"
version = "0.1.0"
description = "Kiwoom OpenAPI toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "pandas>=3.0.3",
    "platformdirs>=4.9.4",
    "requests>=2.33.1",
    "websockets>=15.0.1",
]

[project.scripts]
kiwoom = "kiwoom_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiwoom", "kiwoom_cli"]
artifacts = [
    "kiwoom/_data/*.json",
    "kiwoom_cli/maps/*.csv",
    "kiwoom_cli/maps/*.md",
    "kiwoom_cli/docs/*.md",
    "kiwoom_cli/README.md",
]

[tool.hatch.build.targets.sdist]
# CLI 배포에 필요한 것만 포함(kiwoom, kiwoom_cli, 메타/데이터). 그 외 산출물/개발용 자료는 제외.
exclude = [
    "/.venv",
    "/convention",
    "/examples",
    "/examples_prove",
    "/generator",
    "/postman",
    "/docs",
    "/kiwoom_cli_prove",
    "/dist",
    "/smoke_check.py",
    "**/.DS_Store",
    "**/__pycache__",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: real-server end-to-end tests (require demo credentials)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
