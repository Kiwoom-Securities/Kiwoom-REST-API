[project]
name = "kiwoom-spec-mcp"
version = "1.0.0"
description = "Credential-free MCP server: Kiwoom OpenAPI spec search + example code fetched from GitHub"
requires-python = ">=3.13"
# 정확한 버전은 uv.lock이 고정한다(Dockerfile은 `uv sync --frozen`). 여기서는 호환
# 하한만 선언한다. kwcli는 maps/api_commands.csv에 function_name 열이 실린 버전이
# 필요하다(get_example의 예제 경로 계산) — 0.1.1에는 그 열이 없고 1.0.0부터 있다.
dependencies = [
    "fastmcp>=3.4.4,<4",
    "kwcli>=1.0.0,<2",
]

[project.scripts]
kiwoom-spec-mcp = "kiwoom_spec_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiwoom_spec_mcp"]

# kwcli는 PyPI 게시본을 쓴다. 원격 빌드(Railway)의 컨텍스트가 이 디렉터리라 상위
# 경로를 참조할 수 없기 때문이다. 모노repo의 로컬 kwcli 소스로 테스트하려면 아래를
# 임시로 켠다(그 상태의 uv.lock은 커밋하지 말 것 — 로컬 경로가 박힌다):
# [tool.uv.sources]
# kwcli = { path = "../../", editable = true }
